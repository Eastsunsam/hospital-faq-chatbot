services:
  - type: web
    name: hospital-faq-chatbot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: HOST
        value: "0.0.0.0"
      - key: OPENAI_API_KEY
        sync: false

